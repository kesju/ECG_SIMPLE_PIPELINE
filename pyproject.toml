[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-simple-pipeline"
version = "0.1.0"
description = "Modular ECG denoising pipeline with gap, outlier, and dropout handling."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ECG Pipeline Team" }
]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.scripts]
ecg-pipeline = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecg_pipeline"]

[tool.setuptools]
py-modules = ["cli"]
package-dir = {"" = "."}
